<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature to Fahrenheit Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url('images.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      min-height: 100vh;
    }
    .overlay {
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 1rem;
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card p-4 shadow overlay text-white">
          <h4 class="text-center mb-3">Celsius to Fahrenheit</h4>
          
          <div class="mb-3">
            <label for="temperatureInput" class="form-label">Enter Temperature:</label>
            <input type="number" class="form-control" id="temperatureInput" placeholder="e.g. 32.4">
          </div>
      
          <button class="btn btn-warning w-100" id="convertBtn">Convert</button>
      
          <div class="mt-3 text-center">
            <p id="errMsg"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="temp.js"></script>
</body>
</html>
